version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: road_damage
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Ensure the init job runs before backend accepts traffic
    depends_on:
      - db
      - db_init
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/road_damage
      # 外部APIキーはローカルでは .env で設定してください
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  db_init:
    image: project-road-damage-backend:3.11
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do sleep 1; done; psql postgresql://postgres:postgres@db:5432/road_damage -f /app/migrations/init_schema.sql"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/road_damage
    volumes:
      - ./backend:/app

volumes:
  db_data:
